name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: write  # Fixes the '403 Forbidden' error when uploading the IPA

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    
    # This tells EVERY step below to run inside your project folder
    defaults:
      run:
        working-directory: . 

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🛠️ Update Pods
        run: pod repo update
        working-directory: ios  # Pods must be updated inside the ios folder

      - name: 🏗️ Build iOS Release (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: 📂 Create IPA Structure
        run: |
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r FlutterIpaExport.ipa Payload
        working-directory: build/ios/iphoneos

      - name: 📤 Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/ios/iphoneos/FlutterIpaExport.ipa
          asset_name: PraiseTheLord.ipa
          tag: v1.0
          overwrite: true
          body: "Release generated via GitHub Actions for Praise-The-Lord."
